# WaytoAGI 活动数据每日自动同步
#
# 工作机制：
#   - 每天 UTC 03:00（北京时间 11:00）自动运行
#   - 用 lark-cli 拉取飞书知识库最新活动节点
#   - 更新 activities.json 后自动 commit & push
#   - 部署后网页打开即看到最新数据
#
# 前置条件（在 GitHub 仓库 Settings → Secrets 配置）：
#   - LARK_APP_ID      飞书应用 App ID（cli_xxx）
#   - LARK_APP_SECRET  飞书应用 App Secret
#
# 注意：默认用 bot（应用）身份。bot 需能读取目标知识库：
#   - 公开知识库（如 WaytoAGI）通常可直接读
#   - 私有库需把应用加为成员并开通 wiki:node:read / wiki:space:read scope
#   - 若 bot 读不到，可改用 user 身份（需把 user refresh token 存入 Secrets，
#     但 user token 60 天过期，需定期手动续授）

name: Sync WaytoAGI Activities

on:
  schedule:
    - cron: '0 3 * * *'   # 每天 UTC 03:00（北京 11:00）
  workflow_dispatch:       # 支持手动触发
  push:
    branches: [master]
    paths:
      - 'sync-activities.js'
      - '.github/workflows/sync-activities.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install lark-cli
        run: npm install -g @larksuite/cli

      - name: Configure lark-cli (bot identity)
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
        run: |
          if [ -z "$LARK_APP_ID" ] || [ -z "$LARK_APP_SECRET" ]; then
            echo "::error::LARK_APP_ID / LARK_APP_SECRET secrets not set"
            exit 1
          fi
          lark-cli config set --app-id "$LARK_APP_ID" --app-secret "$LARK_APP_SECRET"

      - name: Run sync
        env:
          LARK_AS: bot
        run: node sync-activities.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add activities.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            git commit -m "chore: auto-sync waytoagi activities ($TS)"
            git push
          fi
